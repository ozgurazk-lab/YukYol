workflows:
  yukyol-web:
    name: YukYol Web MVP
    max_build_duration: 15
    scripts:
      - name: Check project files
        script: |
          set -e
          test -f index.html
          test -f manifest.json
          echo "Required files found."
      - name: Validate HTML entry
        script: |
          set -e
          grep -q "<html" index.html
          grep -q "Sevkio" index.html
          echo "index.html validation passed."
      - name: Validate workflows
        script: |
          set -e
          node --check assets/app.js
          node tests/workflows.cjs
      - name: Package web app
        script: |
          set -e
          mkdir -p build
          cp -r index.html manifest.json README.md assets .nojekyll build/
          cd build
          zip -r ../YukYol-Web-MVP.zip .
    artifacts:
      - YukYol-Web-MVP.zip
